const NAME_VARIANTS = ["PPKRIT", "PPkrit"];
const BRAND_VARIANTS = ["GUCCI", "Gucci", "@GUCCI", "GUCCI."];
const EMOJIS = ["✨", "🔥", "👑", "🤍", "💚❤️", "🖤", "😍", "🥂", "🌟", "💫", "🫶", "👏"];
const COUNT = 5;
const list = document.getElementById("list");
const toast = document.getElementById("toast");
let toastTimer = null;

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function fill(t) {
  return t.replace(/\{name\}/g, pick(NAME_VARIANTS))
          .replace(/\{brand\}/g, pick(BRAND_VARIANTS))
          .replace(/\{emoji\}/g, () => pick(EMOJIS));
}

// ===== Generator: mix of short / medium / long, session-level dedup =====
const seen = new Set();
let mode = "ig"; // "ig" = IG/TT module, "x" = X module (every comment carries hashtags)
const X_TAGS = "#GUCCIxPPKRIT #Gucci #PPKritt";

function generateOne() {
  const r = Math.random();
  let item;
  if (r < 0.35) item = { tag: "short", text: fill(pick(DATA.SHORT)) };
  else if (r < 0.70) item = { tag: "medium", text: fill(pick(DATA.MEDIUM)) };
  else {
    const sentence = pick(DATA.OPENERS) + ", " +
                     fill(pick(DATA.CORES)) + ", " +
                     fill(pick(DATA.CLOSERS));
    item = { tag: "long", text: pick(EMOJIS) + " " + sentence.charAt(0).toUpperCase() + sentence.slice(1) };
  }
  if (mode === "x") item.text += " " + X_TAGS;
  return item;
}

function pickRandom() {
  const out = [];
  let guard = 0;
  while (out.length < COUNT && guard < 200) {
    guard++;
    const item = generateOne();
    if (seen.has(item.text)) continue;
    seen.add(item.text);
    out.push(item);
  }
  return out;
}

// Estimated unique combinations: (short+medium)*2*4 + openers*cores*closers*2*4
const totalUnique = (DATA.SHORT.length + DATA.MEDIUM.length) * 2 * 4
                  + DATA.OPENERS.length * DATA.CORES.length * DATA.CLOSERS.length * 2 * 4;
document.getElementById("stats").textContent =
  DATA.SHORT.length + DATA.MEDIUM.length + " templates + " +
  (DATA.OPENERS.length * DATA.CORES.length * DATA.CLOSERS.length) + " long-form combos ≈ " +
  totalUnique.toLocaleString() + " unique comments possible";

// ===== Render =====
function render() {
  list.innerHTML = "";
  pickRandom().forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "card";
    const highlighted = item.text
      .replace(/PPKRIT|PPkrit/g, m => `<b>${m}</b>`)
      .replace(/@?GUCCI\.?|Gucci/g, m => `<b>${m}</b>`);
    card.innerHTML = `<div class="index">#${i + 1}<span class="tag ${item.tag}">${item.tag}</span></div>`
      + `<div class="text">${highlighted}</div><div class="tip">Tap to copy</div>`;
    card.addEventListener("click", () => copyText(item.text, card));
    list.appendChild(card);
  });
}

// ===== Tap to copy =====
async function copyText(text, card) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  card.classList.add("copied");
  card.querySelector(".tip").textContent = "Copied ✓";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
    card.classList.remove("copied");
    card.querySelector(".tip").textContent = "Tap to copy";
  }, 1500);
}

document.getElementById("refreshBtn").addEventListener("click", render);

// ===== Module switching (IG/TT <-> X) =====
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    if (mode === tab.dataset.mode) return;
    mode = tab.dataset.mode;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    render();
  });
});

render();
</script>
